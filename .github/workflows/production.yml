name: Test and deploy production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Production regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      SECRET_KEY: ci-only-key-no-production-access-please-do-not-reuse
      DEBUG: 'False'
      ADMIN_EMAIL: thechandramonians@gmail.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration and migration drift
        run: |
          python -B manage.py check
          python -B manage.py makemigrations --check --dry-run
      - name: Run backend regression tests
        run: python -B manage.py test --noinput
      - name: Run browser interaction unit tests
        run: node --test tests/*.test.cjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.chandramonians.com
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Trigger production and verify this commit is live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy_production.cjs
